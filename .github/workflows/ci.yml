name: CI

on:
  push:
    branches: [development, main]
  pull_request:
    branches: [development, main]

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install ruff
        run: pip install "ruff>=0.4"

      - name: Ruff lint
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        # Heavy fixtures live on a GitHub Release bundle (issue #322), not in
        # git or LFS. CI does not pull the bundle — tests that need real
        # fixture content are marked `requires_fixture_bundle` and skipped
        # here; devs run those locally after
        # `python scripts/pg-seed-data/sync_fixtures.py`.

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        env:
          PYTHONPATH: .
          LLM_PROVIDER: mock
        run: python -m pytest tests/ enrichment/tests/ analytics/ scripts/tests/ -m "not live_llm and not requires_fixture_bundle" -v --tb=short
